# Eyot Portal Deployment for OrbStack.
#
# Wave 1 of P14b: nginx serving the React SPA built by Dockerfile.portal.
# The container exposes /healthz for kubelet probes; SPA routes fall back to
# /index.html. Service is NodePort so the host browser can hit the SPA
# directly (OrbStack: http://localhost:30174). /api/ is proxied to
# eyot-backend ClusterIP inside the cluster — no port-forward needed.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: eyot-portal
  namespace: eyot
  labels:
    app: eyot-portal
spec:
  replicas: 1
  selector:
    matchLabels:
      app: eyot-portal
  template:
    metadata:
      labels:
        app: eyot-portal
    spec:
      containers:
        - name: portal
          image: eyot-portal:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 5173
          readinessProbe:
            httpGet:
              path: /healthz
              port: 5173
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 5173
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: eyot-portal
  namespace: eyot
spec:
  type: NodePort
  selector:
    app: eyot-portal
  ports:
    - port: 5173
      targetPort: 5173
      nodePort: 30174

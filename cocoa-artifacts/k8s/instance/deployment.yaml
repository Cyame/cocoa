# Eyot Instance Deployment
#
# Template variables (substituted by a deploy script before apply):
#   {instance_id}   — unique Instance UUID
#   {office_id}     — Workspace UUID for isolation labels
#   {workspace_id}  — Workspace UUID (shared hostPath)
#
# Live deploys are built by resource_builder.build_deployment (preferred).
# This manifest documents the pi-native layout:
#   PVC → /data (pi cwd)
#   ConfigMap → /etc/config (SYSTEM.md …)
#   hostPath shared → /data/shared
apiVersion: apps/v1
kind: Deployment
metadata:
  name: "{instance_id}"
  labels:
    app: cocoa-instance
    instance-id: "{instance_id}"
    office-id: "{office_id}"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cocoa-instance
      instance-id: "{instance_id}"
  template:
    metadata:
      labels:
        app: cocoa-instance
        instance-id: "{instance_id}"
        office-id: "{office_id}"
    spec:
      containers:
      - name: cocoa-instance
        image: cocoa-instance:latest
        imagePullPolicy: Never
        env:
        - name: COCOA_WORKSPACE_PATH
          value: /data
        - name: COCOA_AGENT_CONFIG_DIR
          value: /etc/config
        envFrom:
        - configMapRef:
            name: "{instance_id}-config"
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
        volumeMounts:
        - name: data
          mountPath: /data
        - name: config
          mountPath: /etc/config
        - name: shared
          mountPath: /data/shared
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: "{instance_id}-workspace"
      - name: config
        configMap:
          name: "{instance_id}-config"
      - name: shared
        hostPath:
          path: /var/cocoa/workspaces/{workspace_id}/shared
          type: DirectoryOrCreate

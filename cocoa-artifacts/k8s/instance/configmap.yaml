# Eyot Instance ConfigMap
#
# Template variables:
#   {instance_id}  — unique Instance UUID
#
# Holds non-secret runtime configuration for the Instance container.
# RUNTIME_CONFIG is the JSON serialization of Instance.runtime_config
# from the database. INSTANCE_ID provides the container with its own
# identity without querying the API server.
apiVersion: v1
kind: ConfigMap
metadata:
  name: "{instance_id}-config"
  labels:
    app: cocoa-instance
    instance-id: "{instance_id}"
data:
  RUNTIME_CONFIG: "{}"
  INSTANCE_ID: "{instance_id}"

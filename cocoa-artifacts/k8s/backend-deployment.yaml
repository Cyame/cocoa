# Cocoa Backend Deployment for OrbStack.
#
# Wave 1 of P14b: OrbStack-ready backend with HTTP health probes and secrets
# sourced from `cocoa-backend-secrets`. The Secret must be created out-of-band
# (e.g. `kubectl create secret generic cocoa-backend-secrets -n cocoa ...`)
# with the keys: DATABASE_URL, JWT_SECRET, ENCRYPTION_KEY, COCOA_K8S_DISABLED.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cocoa-backend
  namespace: cocoa
  labels:
    app: cocoa-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cocoa-backend
  template:
    metadata:
      labels:
        app: cocoa-backend
    spec:
      serviceAccountName: cocoa-backend
      containers:
        - name: backend
          image: cocoa-backend:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 4510
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: cocoa-backend-secrets
                  key: DATABASE_URL
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: cocoa-backend-secrets
                  key: JWT_SECRET
            - name: ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: cocoa-backend-secrets
                  key: ENCRYPTION_KEY
            - name: COCOA_K8S_DISABLED
              valueFrom:
                secretKeyRef:
                  name: cocoa-backend-secrets
                  key: COCOA_K8S_DISABLED
            - name: COCOA_INSTANCE_IMAGE_PULL_POLICY
              valueFrom:
                secretKeyRef:
                  name: cocoa-backend-secrets
                  key: COCOA_INSTANCE_IMAGE_PULL_POLICY
                  optional: true
            - name: COCOA_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: cocoa-backend-secrets
                  key: COCOA_API_TOKEN
                  optional: true
          readinessProbe:
            httpGet:
              path: /health
              port: 4510
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 4510
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
          volumeMounts:
            # v4.5 H3: the backend dual-writes FornixFile content into the
            # same Host shared tree that instance pods mount at /data/shared.
            - name: fornix-shared
              mountPath: /var/cocoa/workspaces
      volumes:
        - name: fornix-shared
          hostPath:
            path: /var/cocoa/workspaces
            type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: cocoa-backend
  namespace: cocoa
spec:
  type: ClusterIP
  selector:
    app: cocoa-backend
  ports:
    - port: 4510
      targetPort: 4510
# A generic, single database configuration.
#
# The actual DATABASE_URL is read from app.core.config.settings inside
# alembic/env.py. The ``sqlalchemy.url`` line below is a placeholder so
# Alembic's configparser has a value to load.

[alembic]
# path to migration scripts.
script_location = %(here)s/alembic

# sys.path path, will be prepended to sys.path if present.
prepend_sys_path = .

# path_separator; "os" uses os.pathsep for portability.
path_separator = os

# database URL — overridden by alembic/env.py from settings.DATABASE_URL.
sqlalchemy.url = driver://user:pass@localhost/dbname


[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

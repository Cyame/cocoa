[project]
name = "cocoa-backend"
version = "3.5.3"
description = "Cocoa backend service - FastAPI + SQLAlchemy async + Alembic"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    # Database (PostgreSQL)
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    # Auth
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    # Config
    "pydantic-settings>=2.7.0",
    # Database migrations
    "alembic>=1.13.0",
    "kubernetes_asyncio>=28.0.0",  # P11a K8s infrastructure; required by nodeskclaw-style K8sClient
    "loguru>=0.7.3",
    "openai>=1.50.0",
    "anthropic>=0.40.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
]

[tool.ruff]
target-version = "py312"
line-length = 120
# Migrations are autogenerated; do not lint them.
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
